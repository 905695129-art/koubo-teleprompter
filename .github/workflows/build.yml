name: Build Xiaomi 15 Teleprompter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到项目压缩包"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > source/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.kouboteleprompter"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.kouboteleprompter"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi15-Teleprompter-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
